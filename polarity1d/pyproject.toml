[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polarity1d"
version = "0.1.0"
description = "Fast shared 1D framework for canonical polarity and De Belly mechanochemical models"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[project.scripts]
polarity1d-run = "polarity1d.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

