name: scaling_sandbox
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - numba
  - scipy
  - scikit-fem=12.0.2
  - matplotlib
  - pillow
  - pypdf
  - pandas
  - pytest
  - gmsh=4.15.2
  - meshio
  # R dependencies used by the Eroume WGD adapter.
  - r-base=4.4
  - r-matrix
  - r-rcpp
  - r-ggplot2
  - r-gridextra
  - r-xml2
